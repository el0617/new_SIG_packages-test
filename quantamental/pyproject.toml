[project]
name = "sigtd"
version = "0.0.1"
description = "Quantamental top-down engine: signals and analyst views to sector weights"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "fredapi>=0.5",
    "yfinance>=0.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "cvxpy>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigtd = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
